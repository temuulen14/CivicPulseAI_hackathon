<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A dónde va el dinero público en España y en qué merece la pena fijarse." />
    <title>Cristalino · claro como el agua</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Modo claro u oscuro elegido antes (ThemeToggle.jsx): se aplica antes de pintar para que no parpadee -->
    <script>
      try {
        var t = localStorage.getItem('cuentasclaras-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- Icono de la pestaña: una gota de agua azul (la marca Cristalino), dibujada aquí mismo en SVG -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.6c-3.3 4.4-6.6 8.2-6.6 12a6.6 6.6 0 0 0 13.2 0c0-3.8-3.3-7.6-6.6-12z' fill='%23d8eef7' stroke='%233b9fc9' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M8.9 14.6a3.2 3.2 0 0 0 2.4 3.3' fill='none' stroke='%233b9fc9' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Newsreader (serif editorial) para titulares y cifras; Geist (sans) para la interfaz -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A dónde va el dinero público en España y en qué merece la pena fijarse." />
    <title>CuentasClaras</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Modo claro u oscuro elegido antes (ThemeToggle.jsx): se aplica antes de pintar para que no parpadee -->
    <script>
      try {
        var t = localStorage.getItem('cuentasclaras-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- Icono de la pestaña: un cuadrado verde con tres barras, dibujado aquí mismo en SVG -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312805c'/%3E%3Cpath d='M9 23v-7M16 23V9M23 23v-10' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Newsreader (serif editorial) para titulares y cifras; Geist (sans) para la interfaz -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
